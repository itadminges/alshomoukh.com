<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Responsive audit harness</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #ddd; }
      iframe { display: block; border: 0; background: white; }
    </style>
  </head>
  <body>
    <iframe id="audit-frame" title="Responsive audit frame"></iframe>
    <script>
      const params = new URLSearchParams(window.location.search)
      const frame = document.getElementById("audit-frame")
      frame.style.width = `${Number(params.get("w")) || 390}px`
      frame.style.height = `${Number(params.get("h")) || 844}px`
      frame.src = params.get("path") || "/"
    </script>
  </body>
</html>
